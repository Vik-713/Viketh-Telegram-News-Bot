name: Daily Tech News Digest

on:
  schedule:
    - cron: '*/15 7-8 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Restore sent.db cache from previous workflow runs to maintain deduplication
      - name: Restore sent.db cache
        uses: actions/cache@v4
        with:
          path: sent.db
          key: sent-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sent-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Execute LangGraph workflow using secrets configured in GitHub repository
      - name: Execute tech-news-mcp workflow
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python graph.py

